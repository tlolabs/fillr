name: Build FILLR desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test engine
        run: cargo test -p fillr-core
      - name: Build universal package
        run: ./script/release_macos.sh --unsigned
      - name: Smoke test bundled probe
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          shasum -a 256 dist/FILLR.app/Contents/Resources/ffmpeg-9.0.2-source.tar.xz | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          lipo -verify_arch arm64 x86_64 dist/FILLR.app/Contents/Resources/ffprobe
          dist/FILLR.app/Contents/Resources/ffprobe -version | grep -q '^ffprobe version 9.0.2 '
          env PATH=/nonexistent target/debug/fillr-probe-smoke dist/FILLR.app/Contents/MacOS/FILLR tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-macos-universal-unsigned
          path: dist/FILLR-universal-unsigned.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            msystem: UCRT64
            packages: make diffutils mingw-w64-ucrt-x86_64-gcc
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: make diffutils mingw-w64-clang-aarch64-clang
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}
      - name: Build LGPL probe
        shell: msys2 {0}
        run: ./script/build_ffprobe_windows.sh
      - name: Package native app
        shell: pwsh
        run: ./script/release_windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Verify packaged probe through FILLR engine
        shell: pwsh
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          $originalPath = $env:PATH
          try {
            $env:PATH = 'C:\nonexistent'
            & ./target/debug/fillr-probe-smoke.exe "dist/windows-${{ matrix.arch }}/FILLR.exe" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
            if ($LASTEXITCODE -ne 0) { throw 'FILLR packaged probe smoke test failed' }
          } finally { $env:PATH = $originalPath }
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-win-${{ matrix.arch }}-unsigned
          path: dist/FILLR-win-${{ matrix.arch }}-unsigned.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4 build tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev xvfb curl
      - name: Test engine
        run: cargo test -p fillr-core
      - name: Get AppImage packager
        run: |
          curl --fail --location --silent --show-error "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage" -o appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./script/release_linux.sh
      - name: Verify packaged probe through FILLR engine
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          sha256sum "dist/FILLR-${{ matrix.arch }}.AppDir/usr/share/ffmpeg-9.0.2-source.tar.xz" | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/ffprobe" -version | grep -q '^ffprobe version 9.0.2 '
          if [ "${{ matrix.arch }}" = x86_64 ]; then expected='X86-64'; else expected='AArch64'; fi
          readelf -h "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/ffprobe" | grep -q "Machine:.*$expected"
          env PATH=/nonexistent target/debug/fillr-probe-smoke "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/fillr" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set +e
          timeout 8s xvfb-run -a "dist/FILLR-linux-${{ matrix.arch }}.AppImage"
          result=$?
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-linux-${{ matrix.arch }}
          path: dist/FILLR-linux-${{ matrix.arch }}.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FILLR-*
          path: release
          merge-multiple: true
      - name: Publish Windows and Linux downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/*.AppImage --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
