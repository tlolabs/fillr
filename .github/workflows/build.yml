name: Build FILLR desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

  updater-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: python script/version.py --check
      - run: python script/check_updater_snapshot.py
      - run: python -m unittest discover -s script -p "test_update*.py"
      - run: python -m unittest discover -s script -p "test_direct_release.py"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test engine
        run: cargo test -p fillr-core
      - name: Build universal package
        run: ./script/release_macos.sh --unsigned
      - name: Test real Sparkle signing tools
        run: python3 -m unittest discover -s script -p "test_update_sparkle.py"
      - name: Test native update policy
        run: RUST_LIB_DIR="$PWD/dist/universal-libs" swift test --package-path native/macos
      - name: Test animated Dock icon
        run: |
          xcrun swiftc -parse-as-library native/macos/Sources/FILLR/Services/DockIconController.swift native/macos/Tests/DockIconChecks.swift -o dist/dock-icon-checks
          mkdir -p dist/dock-icon-preview
          dist/dock-icon-checks dist/FILLR.app/Contents/Resources dist/dock-icon-preview
      - name: Smoke test bundled probe
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          shasum -a 256 dist/FILLR.app/Contents/Resources/ffmpeg-9.0.2-source.tar.xz | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          lipo dist/FILLR.app/Contents/Resources/ffprobe -verify_arch arm64 x86_64
          dist/FILLR.app/Contents/Resources/ffprobe -version | grep -q '^ffprobe version 9.0.2 '
          env PATH=/nonexistent target/debug/fillr-probe-smoke dist/FILLR.app/Contents/MacOS/FILLR tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-macos-universal-unsigned
          path: dist/FILLR-universal-unsigned.zip
          if-no-files-found: error

  windows-x64:
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: x64
      runner: windows-2025
      qt_arch: win64_msvc2022_64
      msystem: UCRT64
      packages: make diffutils patch mingw-w64-ucrt-x86_64-gcc

  windows-arm64:
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: arm64
      runner: windows-11-arm
      qt_arch: win64_msvc2022_arm64
      msystem: CLANGARM64
      packages: make diffutils patch mingw-w64-clang-aarch64-clang

  linux-x64:
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04

  linux-arm64:
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    permissions:
      contents: write
    uses: ./.github/workflows/publish-direct.yml
    with:
      kind: macos
      artifact: FILLR-macos-universal-unsigned

  publish-windows-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    permissions:
      contents: write
    uses: ./.github/workflows/publish-direct.yml
    with:
      kind: windows-x64
      artifact: FILLR-win-x64-unsigned

  publish-windows-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-arm64
    permissions:
      contents: write
    uses: ./.github/workflows/publish-direct.yml
    with:
      kind: windows-arm64
      artifact: FILLR-win-arm64-unsigned

  publish-linux-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-x64
    permissions:
      contents: write
    uses: ./.github/workflows/publish-direct.yml
    with:
      kind: linux-x64
      artifact: FILLR-linux-x86_64

  publish-linux-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-arm64
    permissions:
      contents: write
    uses: ./.github/workflows/publish-direct.yml
    with:
      kind: linux-arm64
      artifact: FILLR-linux-aarch64

  qt-internal-macos:
    name: INTERNAL Qt reference (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: brew install qt
      - run: ./script/build_qt_macos.sh
      - run: ctest --test-dir target/qt-release -R '^fillr_qt_settings$' --output-on-failure
      - name: Best-effort Qt accessibility checks
        continue-on-error: true
        run: ctest --test-dir target/qt-release -R '^fillr_qt_accessibility$' --output-on-failure
      - name: Verify reference identity and packaged media
        run: |
          python3 script/check_qt_isolation.py dist/FILLR-Qt-Internal.app
          cargo build -p fillr-core --bin fillr-probe-smoke
          env PATH=/nonexistent target/debug/fillr-probe-smoke dist/FILLR-Qt-Internal.app/Contents/MacOS/FILLR tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-ONLY-FILLR-Qt-osx-arm64
          path: dist/FILLR-qt-INTERNAL-osx-arm64.zip
          if-no-files-found: error

  report-failures:
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [security-audit, updater-tests, macos, windows-x64, windows-arm64, linux-x64, linux-arm64, qt-internal-macos, publish-macos, publish-windows-x64, publish-windows-arm64, publish-linux-x64, publish-linux-arm64]
    runs-on: ubuntu-24.04
    concurrency:
      group: fillr-consolidated-ci-issue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Maintain the consolidated CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 script/report_ci_failures.py
