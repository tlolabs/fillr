name: Build FILLR desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read

jobs:
  updater-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet test native/desktop.tests -c Release -warnaserror -p:RestoreLockedMode=true
      - run: dotnet format native/desktop/FILLR.Desktop.csproj --verify-no-changes
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: python script/version.py --check
      - run: python script/check_updater_snapshot.py
      - run: python -m unittest discover -s script -p "test_update*.py"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test engine
        run: cargo test -p fillr-core
      - name: Build universal package
        run: ./script/release_macos.sh --unsigned
      - name: Test real Sparkle signing tools
        run: python3 -m unittest discover -s script -p "test_update_sparkle.py"
      - name: Test native update policy
        run: RUST_LIB_DIR="$PWD/dist/universal-libs" swift test --package-path native/macos
      - name: Smoke test bundled probe
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          shasum -a 256 dist/FILLR.app/Contents/Resources/ffmpeg-9.0.2-source.tar.xz | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          lipo dist/FILLR.app/Contents/Resources/ffprobe -verify_arch arm64 x86_64
          dist/FILLR.app/Contents/Resources/ffprobe -version | grep -q '^ffprobe version 9.0.2 '
          env PATH=/nonexistent target/debug/fillr-probe-smoke dist/FILLR.app/Contents/MacOS/FILLR tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-macos-universal-unsigned
          path: dist/FILLR-universal-unsigned.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            msystem: UCRT64
            packages: make diffutils patch mingw-w64-ucrt-x86_64-gcc
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: make diffutils patch mingw-w64-clang-aarch64-clang
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Compile shared UI before packaging tools
        shell: pwsh
        run: dotnet build native/desktop/FILLR.Desktop.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-${{ matrix.arch }} --self-contained true -warnaserror
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}
      - name: Build LGPL probe
        shell: msys2 {0}
        run: ./script/build_ffprobe_windows.sh
      - name: Package native app
        shell: pwsh
        run: ./script/release_windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Verify packaged probe through FILLR engine
        shell: pwsh
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          $originalPath = $env:PATH
          try {
            $env:PATH = 'C:\nonexistent'
            & ./target/debug/fillr-probe-smoke.exe "dist/windows-${{ matrix.arch }}/FILLR.exe" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
            if ($LASTEXITCODE -ne 0) { throw 'FILLR packaged probe smoke test failed' }
          } finally { $env:PATH = $originalPath }
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-win-${{ matrix.arch }}-unsigned
          path: dist/FILLR-win-${{ matrix.arch }}-unsigned.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Install native runtime and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libice6 libsm6 libxrandr2 libxi6 libxcursor1 libicu74 libfontconfig1 libnotify4 xvfb curl at-spi2-core dbus-x11
      - name: Test shared engine and presentation
        run: |
          cargo test --locked -p fillr-core
          dotnet test native/desktop.tests -c Release -warnaserror -p:RestoreLockedMode=true
      - name: Get AppImage packager
        run: |
          curl --fail --location --silent --show-error "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage" -o appimagetool
          python3 script/verify_appimagetool.py appimagetool "${{ matrix.arch }}"
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./script/release_linux.sh
      - name: Verify packaged probe through FILLR engine
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          sha256sum "dist/FILLR-${{ matrix.arch }}.AppDir/usr/share/ffmpeg-9.0.2-source.tar.xz" | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/ffprobe" -version | grep -q '^ffprobe version 9.0.2 '
          if [ "${{ matrix.arch }}" = x86_64 ]; then expected='X86-64'; else expected='AArch64'; fi
          readelf -h "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/ffprobe" | grep -q "Machine:.*$expected"
          env PATH=/nonexistent target/debug/fillr-probe-smoke "dist/FILLR-${{ matrix.arch }}.AppDir/usr/bin/fillr" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set +e
          timeout 8s xvfb-run -a dbus-run-session -- "dist/FILLR-linux-${{ matrix.arch }}.AppImage"
          result=$?
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-linux-${{ matrix.arch }}
          path: dist/FILLR-linux-${{ matrix.arch }}.AppImage

  avalonia-internal-macos:
    name: INTERNAL Avalonia reference (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet test native/desktop.tests -c Release -warnaserror -p:RestoreLockedMode=true
      - run: ./script/build_avalonia_macos.sh
      - name: Verify reference identity and packaged media
        run: |
          python3 script/check_avalonia_isolation.py dist/FILLR-Avalonia-Internal.app
          cargo build -p fillr-core --bin fillr-probe-smoke
          env PATH=/nonexistent target/debug/fillr-probe-smoke dist/FILLR-Avalonia-Internal.app/Contents/MacOS/FILLR tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-ONLY-FILLR-Avalonia-osx-arm64
          path: dist/FILLR-avalonia-INTERNAL-osx-arm64.zip
          if-no-files-found: error
