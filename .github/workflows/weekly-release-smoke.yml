name: Weekly tagged-release packages
on:
  schedule:
    # Sunday 08:17 PST / 09:17 PDT. GitHub schedules may start later.
    - cron: '17 16 * * 0'
permissions:
  contents: read
concurrency:
  group: weekly-tagged-release-smoke
  cancel-in-progress: false
jobs:
  select:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_new: ${{ steps.tags.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: tags
        name: Select and claim new version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 control/.github/scripts/weekly_delivery.py select
          --pattern '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
          --baseline-file control/.github/weekly-smoke-baseline.json
          --targets linux-x64,linux-arm64,windows-x64,windows-arm64 --claim
  smoke:
    name: Smoke ${{ matrix.tag }} (${{ matrix.target }})
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.target == 'windows-arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
      PACKAGE_TAG: ${{ matrix.tag }}
      PACKAGE_SHA: ${{ matrix.sha }}
      RUSTUP_TOOLCHAIN: 1.99.1
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      RUST_TARGET: ${{ endsWith(matrix.target, 'arm64') && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ runner.os == 'Windows' && env.RUST_TARGET || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-private-dev qt6-qpa-plugins libnotify-dev xvfb dbus-x11 qt6-wayland curl build-essential nasm pkg-config libfuse2t64 zstd file
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.3'
          host: ${{ endsWith(matrix.target, 'arm64') && 'windows_arm64' || 'windows' }}
          target: desktop
          arch: ${{ endsWith(matrix.target, 'arm64') && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          curl --fail --location "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage" -o "$RUNNER_TEMP/appimagetool"
          python3 script/verify_appimagetool.py "$RUNNER_TEMP/appimagetool" "$arch"
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ./script/release_linux.sh
          # Check the final archive, not the build tree; no installed Qt fallback.
          image="$PWD/dist/FILLR-linux-$arch.AppImage"
          test "$("$image" --version)" = "${PACKAGE_TAG#v}"
          xvfb-run -a dbus-run-session -- python3 ../control/.github/scripts/launch_smoke.py "$image" --platform xcb
          mkdir "$RUNNER_TEMP/fillr-extracted"
          cd "$RUNNER_TEMP/fillr-extracted"
          "$image" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/ffprobe -version | grep '^ffprobe version 9.0.2 '
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ endsWith(matrix.target, 'arm64') && 'CLANGARM64' || 'UCRT64' }}
          update: true
          install: ${{ endsWith(matrix.target, 'arm64') && 'make diffutils tar mingw-w64-clang-aarch64-toolchain' || 'make diffutils tar nasm mingw-w64-ucrt-x86_64-toolchain' }}
      - name: Build matching Windows FFprobe
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./script/build_ffprobe_windows.sh
      - name: Package Windows direct download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Select-String -Path script/release_windows.ps1 -Pattern '\[switch\]\$SmokeOnly' -Quiet)) {
            throw 'This tag predates weekly packaging support. Create a new release tag containing SmokeOnly; no full-suite fallback.'
          }
          ./script/release_windows.ps1 -Architecture $env:ARCH -SmokeOnly
          if ($LASTEXITCODE) { throw 'Windows packaging failed' }
          $extract = Join-Path $env:RUNNER_TEMP 'fillr-extracted'
          Expand-Archive "dist/FILLR-win-$env:ARCH-unsigned.zip" $extract
          $actual = & "$extract/FILLR.exe" --version
          if ($LASTEXITCODE -or $actual.Trim() -ne $env:PACKAGE_TAG.Substring(1)) { throw 'Packaged version mismatch' }
          & "$extract/ffprobe.exe" -version
          if ($LASTEXITCODE) { throw 'Packaged FFprobe failed' }
          # No Qt development paths: plugins and DLLs must be supplied by package.
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & $python ../control/.github/scripts/launch_smoke.py "$extract/FILLR.exe" --platform windows
          if ($LASTEXITCODE) { throw 'Packaged GUI startup failed' }
      - name: Stage immutable verified artifacts
        shell: bash
        run: python ../control/.github/scripts/weekly_package.py stage ../weekly-artifact --source .
      - uses: actions/upload-artifact@v4
        with:
          name: fillr-${{ matrix.sha }}-${{ matrix.target }}
          path: weekly-artifact/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish ${{ matrix.tag }} (${{ matrix.target }})
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
      PACKAGE_TAG: ${{ matrix.tag }}
      PACKAGE_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      # Missing artifacts fail only this matrix target. Other targets still publish.
      - uses: actions/download-artifact@v4
        with:
          name: fillr-${{ matrix.sha }}-${{ matrix.target }}
          path: verified
      - name: Attach only verified direct-download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/weekly_package.py publish verified
  finalize:
    needs: [select, smoke, publish]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Record each native target outcome
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: python3 control/.github/scripts/weekly_delivery.py finalize
