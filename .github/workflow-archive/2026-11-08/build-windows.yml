name: Build FILLR Windows package

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      qt_arch:
        required: true
        type: string
      msystem:
        required: true
        type: string
      packages:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: ${{ inputs.qt_arch }}
          cache: true
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.26.0
        with:
          msystem: ${{ inputs.msystem }}
          update: true
          install: ${{ inputs.packages }}
      - name: Build LGPL probe
        shell: msys2 {0}
        run: ./script/build_ffprobe_windows.sh
      - name: Package native app
        shell: pwsh
        run: ./script/release_windows.ps1 -Architecture ${{ inputs.arch }}
      - name: Test Qt settings
        shell: pwsh
        run: ctest --test-dir target/qt-windows-${{ inputs.arch }} -C Release -R '^fillr_qt_settings$' --output-on-failure
      - name: Best-effort Qt accessibility checks
        continue-on-error: true
        shell: pwsh
        run: ctest --test-dir target/qt-windows-${{ inputs.arch }} -C Release -R '^fillr_qt_accessibility$' --output-on-failure
      - name: Verify packaged probe through FILLR engine
        shell: pwsh
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          $originalPath = $env:PATH
          try {
            $env:PATH = 'C:\nonexistent'
            & ./target/debug/fillr-probe-smoke.exe "dist/windows-${{ inputs.arch }}/FILLR.exe" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
            if ($LASTEXITCODE -ne 0) { throw 'FILLR packaged probe smoke test failed' }
          } finally { $env:PATH = $originalPath }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FILLR-win-${{ inputs.arch }}-unsigned
          path: dist/FILLR-win-${{ inputs.arch }}-unsigned.zip
          if-no-files-found: error
