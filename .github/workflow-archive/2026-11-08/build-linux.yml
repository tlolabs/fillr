name: Build FILLR Linux package

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
    outputs:
      runtime_status:
        description: AppImage launch smoke test result
        value: ${{ jobs.build.outputs.runtime_status }}
      runtime_reason:
        description: Reason the AppImage launch smoke test was skipped
        value: ${{ jobs.build.outputs.runtime_reason }}
      accessibility_status:
        description: Optional Qt accessibility test result
        value: ${{ jobs.build.outputs.accessibility_status }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      runtime_status: ${{ steps.appimage_smoke.outputs.status }}
      runtime_reason: ${{ steps.appimage_smoke.outputs.reason }}
      accessibility_status: ${{ steps.accessibility.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native runtime and packaging tools
        run: sudo apt-get update && sudo apt-get install -y cmake qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland libnotify-dev libx11-dev libice6 libsm6 libxrandr2 libxi6 libxcursor1 libfontconfig1 xvfb curl at-spi2-core dbus-x11
      - name: Test shared engine and presentation
        run: |
          cargo test --locked -p fillr-core
          cargo build --locked --release -p fillr-core
          cmake -S native/qt -B target/qt-linux-tests -DCMAKE_BUILD_TYPE=Release -DFILLR_CORE_LIBRARY="$PWD/target/release/libfillr_core.so"
          cmake --build target/qt-linux-tests --parallel
          ctest --test-dir target/qt-linux-tests -R '^fillr_qt_settings$' --output-on-failure
      - name: Best-effort Qt accessibility checks
        id: accessibility
        continue-on-error: true
        run: ctest --test-dir target/qt-linux-tests -R '^fillr_qt_accessibility$' --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Report optional accessibility failure
        if: steps.accessibility.outcome == 'failure'
        run: echo 'Optional Qt accessibility checks failed; see the test log above. Publication remains eligible if required checks pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Get AppImage packager
        run: |
          curl --fail --location --silent --show-error "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ inputs.arch }}.AppImage" -o appimagetool
          python3 script/verify_appimagetool.py appimagetool "${{ inputs.arch }}"
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./script/release_linux.sh
      - name: Verify packaged probe through FILLR engine
        run: |
          cargo build -p fillr-core --bin fillr-probe-smoke
          sha256sum "dist/FILLR-${{ inputs.arch }}.AppDir/usr/share/ffmpeg-9.0.2-source.tar.xz" | grep -q '^8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
          "dist/FILLR-${{ inputs.arch }}.AppDir/usr/bin/ffprobe" -version | grep -q '^ffprobe version 9.0.2 '
          if [ "${{ inputs.arch }}" = x86_64 ]; then expected='X86-64'; else expected='AArch64'; fi
          readelf -h "dist/FILLR-${{ inputs.arch }}.AppDir/usr/bin/ffprobe" | grep -q "Machine:.*$expected"
          env PATH=/nonexistent target/debug/fillr-probe-smoke "dist/FILLR-${{ inputs.arch }}.AppDir/usr/bin/fillr" tests/fixtures/probe.mpg tests/fixtures/probe.mp4
      - name: Smoke test AppImage when runtime infrastructure is available
        id: appimage_smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          if ! command -v timeout >/dev/null || ! command -v xvfb-run >/dev/null || ! command -v dbus-run-session >/dev/null; then
            echo 'status=skipped' >> "$GITHUB_OUTPUT"
            echo 'reason=Display or session test tools are unavailable on the runner.' >> "$GITHUB_OUTPUT"
            echo 'AppImage launch smoke test skipped: display or session test tools are unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! xvfb-run -a true || ! dbus-run-session -- true; then
            echo 'status=skipped' >> "$GITHUB_OUTPUT"
            echo 'reason=Display or session service could not start on the runner.' >> "$GITHUB_OUTPUT"
            echo 'AppImage launch smoke test skipped: display or session service could not start.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          timeout 8s xvfb-run -a dbus-run-session -- "dist/FILLR-linux-${{ inputs.arch }}.AppImage"
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "AppImage exited unexpectedly with status $result" >&2
            exit 1
          fi
          echo 'status=passed' >> "$GITHUB_OUTPUT"
      - name: Verify AppImage integrity and checksum
        run: |
          set -euo pipefail
          artifact="dist/FILLR-linux-${{ inputs.arch }}.AppImage"
          test -s "$artifact"
          python3 - "$artifact" <<'PY'
          from pathlib import Path
          import sys
          with Path(sys.argv[1]).open('rb') as stream:
              header = stream.read(20)
          if header[:4] != b'\x7fELF' or header[8:11] != b'AI\x02':
              raise SystemExit('Invalid type 2 AppImage header')
          expected = {'x86_64': 62, 'aarch64': 183}["${{ inputs.arch }}"]
          if int.from_bytes(header[18:20], 'little') != expected:
              raise SystemExit('AppImage architecture does not match runner target')
          PY
          sha256sum "$artifact" > "$artifact.sha256"
          sha256sum --check "$artifact.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FILLR-linux-${{ inputs.arch }}
          path: dist/FILLR-linux-${{ inputs.arch }}.AppImage
          if-no-files-found: error
