[package]
name = "fillr-update-policy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "FILLR packaging policy over the shared TLO updater snapshot"

[dependencies]
tlo-updater = { path = "../../updater" }
base64 = "0.22.1"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
