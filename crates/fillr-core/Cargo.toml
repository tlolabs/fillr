[package]
name = "fillr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
good_lp = { version = "1.15", default-features = false, features = ["highs"] }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
