[workspace]
members = ["crates/fillr-core", "updater", "crates/fillr-update-policy", "crates/fillr-update"]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
